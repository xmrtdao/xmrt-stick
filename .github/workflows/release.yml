name: Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## XMRT Stick Release
            
            Fire Stick Agent Device UI
            
            ### What's Changed
            See changelog below for details.
            
            ### Installation
            Download the latest build from the Hugging Face Space:
            https://huggingface.co/spaces/XMRTDAO/xmrt-stick

  deploy-and-package:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate HTML
        run: |
          if [ -f index.html ]; then
            echo "✓ index.html exists"
          else
            echo "✗ index.html missing"
            exit 1
          fi

      - name: Create release package
        run: |
          mkdir -p release-package
          cp index.html release-package/
          cp README.md release-package/
          cp LICENSE release-package/
          zip -r xmrt-stick-${{ github.ref_name }}.zip release-package/

      - name: Upload release package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./xmrt-stick-${{ github.ref_name }}.zip
          asset_name: xmrt-stick-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" > CHANGELOG.md
          else
            git log --pretty=format:"- %s" > CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Upload CHANGELOG.md
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./CHANGELOG.md
          asset_name: CHANGELOG.md
          asset_content_type: text/markdown
